name: 'Tests: Unit'
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  unit_tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    # SvelteKit validates these whenever the web app starts, which
    # includes its tests as well as the build and check
    env:
      PUBLIC_FATHOM_ID: ${{ secrets.PUBLIC_FATHOM_ID }}
      PUBLIC_FATHOM_URL: ${{ secrets.PUBLIC_FATHOM_URL }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Check
        run: pnpm run check
      - name: Test
        run: pnpm run test:ci
